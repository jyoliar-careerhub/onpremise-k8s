---
- name: Longhorn 필수 패키지 설치
  hosts: k8s-nodes
  become: yes
  tasks:
    - name: Install open-iscsi and nfs-common
      apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
        update_cache: yes

    - name: Enable and start iscsid
      systemd:
        name: iscsid
        enabled: yes
        state: started

- name: Longhorn 스토리지 노드 준비
  hosts: k8s-workers
  become: yes
  tasks:
    - name: Find unmounted NVMe disk (no partitions)
      shell: |
        for disk in /dev/nvme*n1; do
          if [ -b "$disk" ] && ! lsblk "$disk" 2>/dev/null | grep -q 'part'; then
            echo "$disk"
            break
          fi
        done
      register: unmounted_nvme
      changed_when: false

    - name: Show detected disk
      debug:
        msg: "Unmounted NVMe disk: {{ unmounted_nvme.stdout | default('none') }}"

    - name: Create Longhorn data directory
      file:
        path: /var/lib/longhorn
        state: directory
        mode: '0755'
      when: unmounted_nvme.stdout != ""

    - name: Create filesystem on NVMe disk
      filesystem:
        fstype: ext4
        dev: "{{ unmounted_nvme.stdout }}"
      when: unmounted_nvme.stdout != ""

    - name: Mount NVMe disk to /var/lib/longhorn
      mount:
        path: /var/lib/longhorn
        src: "{{ unmounted_nvme.stdout }}"
        fstype: ext4
        opts: defaults
        state: mounted
      when: unmounted_nvme.stdout != ""

    - name: Label node for Longhorn storage
      command: >
        kubectl label node {{ ansible_hostname }}
        node.longhorn.io/create-default-disk=true
        --overwrite
        --kubeconfig /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['k8s-masters'][0] }}"
      when: unmounted_nvme.stdout != ""
