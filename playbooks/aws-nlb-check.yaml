---
# AWS NLB 사전 검증 플레이북
# infra_provider=aws 일 때만 실행되며, NLB DNS가 올바르게 설정되었는지 확인합니다.

- name: AWS NLB 사전 검증
  hosts: k8s-masters[0]
  gather_facts: no
  tasks:
    - name: infra_provider가 aws가 아니면 스킵
      meta: end_play
      when: infra_provider | default('baremetal') != 'aws'

    - name: AWS 환경 - NLB DNS 설정 확인
      fail:
        msg: |
          AWS 환경에서는 nlb_dns_name 변수가 필수입니다.
          inventory 파일에 다음과 같이 설정하세요:
          nlb_dns_name=your-nlb-xxxx.elb.region.amazonaws.com
      when: nlb_dns_name is not defined or nlb_dns_name | length == 0

    - name: NLB DNS 정보 출력
      debug:
        msg: "AWS NLB DNS: {{ nlb_dns_name }}"

    - name: NLB DNS 해석 테스트
      shell: "nslookup {{ nlb_dns_name }} || host {{ nlb_dns_name }} || echo 'DNS lookup failed but continuing...'"
      register: dns_lookup
      ignore_errors: yes

    - name: DNS 조회 결과
      debug:
        var: dns_lookup.stdout_lines
      when: dns_lookup.stdout_lines is defined
