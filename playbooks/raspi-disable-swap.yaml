---
- name: Raspberry Pi swap 영구 비활성화 (zram + file)
  hosts: raspberrypi
  become: yes
  tasks:
    - name: Turn off all swap
      command: swapoff -a
      changed_when: true

    - name: Stop and disable zram swap service
      systemd:
        name: systemd-zram-setup@zram0.service
        state: stopped
        enabled: no
        masked: yes
      ignore_errors: yes

    - name: Stop and disable zram writeback timer
      systemd:
        name: rpi-zram-writeback.timer
        state: stopped
        enabled: no
        masked: yes
      ignore_errors: yes

    - name: Stop and disable loop swap service
      systemd:
        name: rpi-setup-loop@var-swap.service
        state: stopped
        enabled: no
        masked: yes
      ignore_errors: yes

    - name: Disable zram generator
      copy:
        content: ""
        dest: /etc/systemd/zram-generator.conf
        mode: '0644'

    - name: Verify swap is off
      command: swapon --show
      register: swap_check
      changed_when: false

    - name: Show swap status
      debug:
        msg: "{{ 'Swap is OFF' if swap_check.stdout == '' else 'WARNING: swap still active - ' + swap_check.stdout }}"
