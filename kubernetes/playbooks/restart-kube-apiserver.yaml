# kube-apiserver 만 마스터 1대씩 재기동한다 — enc-config.yaml 처럼 매니페스트 밖의 입력이 바뀌었을 때.
# kubelet 은 static pod 매니페스트 내용이 같으면 재기동하지 않으므로(kubeadm-reconfigure 로는 반영 안 됨),
# 매니페스트를 잠시 디렉터리 밖으로 옮겨 파드를 내리고 되돌려 새로 띄운다. 파드가 새로 만들어지므로
# restartCount 는 0 에서 시작한다. 다음 마스터로 가기 전에 livez 와 클러스터 응답을 확인한다.
#
# 실행 예:
#   ansible-playbook -i inventory/baremetal playbooks/restart-kube-apiserver.yaml
#   (--limit 'k8s-masters[0]' 등으로 1대씩 확인하며 진행 가능)
# 용도: Secret 암호화 키 로테이션(ops-workflow#73) — enc-config.yaml 배포(encrypting-secrets.yaml) 뒤.

- hosts: k8s-masters
  become: true
  serial: 1
  vars:
    manifest: /etc/kubernetes/manifests/kube-apiserver.yaml
    parked: /etc/kubernetes/kube-apiserver.yaml.restart
  tasks:
    - name: Park kube-apiserver manifest (kubelet stops the pod)
      command: mv {{ manifest }} {{ parked }}

    - name: Wait until kube-apiserver container is gone
      command: crictl ps --name kube-apiserver -q
      register: running
      until: running.stdout == ''
      retries: 30
      delay: 2
      changed_when: false

    - name: Restore kube-apiserver manifest (kubelet starts a new pod)
      command: mv {{ parked }} {{ manifest }}

    - name: Wait for kube-apiserver to be healthy
      command: curl -sk https://127.0.0.1:6443/livez
      register: apiserver_health
      until: apiserver_health.stdout == 'ok'
      retries: 60
      delay: 5
      changed_when: false

    - name: Verify cluster is responsive before moving to next master
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes
      changed_when: false
