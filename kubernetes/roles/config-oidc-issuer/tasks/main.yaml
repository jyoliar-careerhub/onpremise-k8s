- name: Backup kube-apiserver.yaml
  shell: cp /etc/kubernetes/manifests/kube-apiserver.yaml /tmp/kube-apiserver.yaml.$(date +%Y%m%d%H%M%S)

- name: Check current service-account-issuer
  shell: grep -oP '(?<=--service-account-issuer=).+' /etc/kubernetes/manifests/kube-apiserver.yaml
  register: current_issuer
  changed_when: false
  failed_when: false

- name: Update service-account-issuer
  lineinfile:
    dest: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '--service-account-issuer='
    line: '    - --service-account-issuer={{ service_account_issuer }}'
    insertbefore: '--service-account-key-file='
    backup: no
  when: current_issuer.stdout != service_account_issuer
  register: issuer_changed

- name: Wait for kube-apiserver to restart
  wait_for:
    port: 6443
    host: "{{ ansible_host }}"
    delay: 10
    timeout: 120
  when: issuer_changed is changed
