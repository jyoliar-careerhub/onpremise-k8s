apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v{{ kubernetes_full_version }}
# infra_provider에 따른 controlPlaneEndpoint 설정:
# - baremetal: kube-vip VIP 사용
# - aws: AWS NLB DNS 사용
{% if infra_provider | default('baremetal') == 'aws' %}
controlPlaneEndpoint: "{{ nlb_dns_name }}:6443"
{% else %}
controlPlaneEndpoint: "{{ virtual_ip }}:6443"
{% endif %}
networking:
  podSubnet: {{ pod_network_cidr }}
# v1beta4의 extraArgs는 name/value 목록이다 — map 표기는 조용히 무시되어 선언에 반영되지 않는다
apiServer:
  extraArgs:
  - name: service-account-issuer
    value: "{{ service_account_issuer }}"
{% if apiserver_encryption_enabled | default(false) %}
  # enc-config.yaml은 encrypt-secrets 롤이 배포한다 — 파일이 없는 신규 init에서 켜면 apiserver가 기동 실패하므로
  # 인벤토리 변수로 게이트한다 (기존 클러스터 재구성: true / 신규 구축: encrypt-secrets 적용 후 true로 전환)
  - name: encryption-provider-config
    value: /etc/kubernetes/pki/enc-config.yaml
{% endif %}
  certSANs:
{% if infra_provider | default('baremetal') == 'aws' and nlb_dns_name is defined %}
  - {{ nlb_dns_name }}
{% elif virtual_ip is defined %}
  - {{ virtual_ip }}
{% endif %}
{% for master in groups["dc1-k8s-masters"] %}
  - {{ hostvars[master]['ansible_host'] }}
{% endfor %}
  - localhost
  - 127.0.0.1
# bind-address 0.0.0.0: Prometheus 스크레이핑용 (기본 127.0.0.1)
controllerManager:
  extraArgs:
  - name: bind-address
    value: "0.0.0.0"
scheduler:
  extraArgs:
  - name: bind-address
    value: "0.0.0.0"
etcd:
  local:
    extraArgs:
    - name: listen-metrics-urls
      value: "http://0.0.0.0:2381"
    # extensive: etcdGRPCRequestsSlow 알럿의 원천(grpc_server_handling_seconds_*) 노출 (ops-workflow#25 코멘트 요청)
    - name: metrics
      value: extensive
{% if setup == "private" and container_registry is defined %}
imageRepository: {{ container_registry }}
{% endif %}
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
serverTLSBootstrap: true
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
# 0.0.0.0: Prometheus 스크레이핑용 (기본 127.0.0.1 — 기존 config-kube-proxy 롤의 post-init 패치를 선언으로 대체)
metricsBindAddress: "0.0.0.0:10249"
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
# advertiseAddress: 렌더링되는 마스터 자신의 IP — init·재구성(init phase control-plane) 모두에서
# 기본 라우트 인터페이스 추정 대신 명시적으로 고정한다
localAPIEndpoint:
  advertiseAddress: {{ ansible_host }}
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
