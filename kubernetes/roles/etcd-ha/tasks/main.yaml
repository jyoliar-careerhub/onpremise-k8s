- name: Set etcd architecture
  set_fact:
    etcd_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Generate etcd certs for each master node
  shell: |
    cd /etc/kubernetes/pki/etcd
    /usr/local/bin/cfssl print-defaults csr > config.json

- name: Add localhost to the hosts
  lineinfile:
    dest: /etc/kubernetes/pki/etcd/config.json
    regexp: '"localhost",'
    line:     '"localhost",'
    insertbefore: '"example.net",'
    backup: no

- replace:
    path: /etc/kubernetes/pki/etcd/config.json
    regexp: 'CN/{s/example\.net'
    replace: "{{ inventory_hostname }}"
    backup: no

- replace:
    path: /etc/kubernetes/pki/etcd/config.json
    regexp: 'www\.example\.net'
    replace: "{{ hostvars[inventory_hostname]['ansible_host'] }}"
    backup: no

- replace:
    path: /etc/kubernetes/pki/etcd/config.json
    regexp: 'example\.net'
    replace: "{{ inventory_hostname }}"
    backup: no

- name: Generate etcd peer certs for each master node
  shell: |
    cd /etc/kubernetes/pki/etcd
    /usr/local/bin/cfssl gencert -ca=ca.pem -ca-key=ca-key.pem -config=ca-config.json -profile=server config.json | /usr/local/bin/cfssljson -bare server


- name: Generate etcd server certs for each master node
  shell: |
    cd /etc/kubernetes/pki/etcd
    /usr/local/bin/cfssl gencert -ca=ca.pem -ca-key=ca-key.pem -config=ca-config.json -profile=peer config.json | /usr/local/bin/cfssljson -bare peer


- name: Download etcd
  get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/{{ etcd_version }}/etcd-{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz"
    dest: /tmp/
    mode: '0755'
    timeout: 120

- name: Unarchive etcd
  unarchive:
    src: "/tmp/etcd-{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz"
    dest: /tmp/
    remote_src: yes

- name: Install etcd
  copy:
    src: "/tmp/etcd-{{ etcd_version }}-linux-{{ etcd_arch }}/etcd"
    dest: /usr/local/bin/etcd
    mode: '0755'
    remote_src: yes

- name: Install etcdctl
  copy:
    src: "/tmp/etcd-{{ etcd_version }}-linux-{{ etcd_arch }}/etcdctl"
    dest: /usr/local/bin/etcdctl
    mode: '0755'
    remote_src: yes

- name: Copy etcd config file
  template:
    src: etcd.service
    dest: /etc/systemd/system/etcd.service

- name: Copy etcd.env config file
  template:
    src: etcd.env
    dest: /etc/etcd.env

- name: start and enable etcd
  systemd:
    name: etcd
    enabled: yes
    daemon_reload: yes
    state: restarted
