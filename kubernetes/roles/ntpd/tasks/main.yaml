- name: Install chrony
  become: yes
  apt:
    name: chrony
    state: present
    update_cache: yes

- name: Ensure chrony service is enabled and started
  become: yes
  systemd:
    name: chrony
    state: started
    enabled: yes

- name: Force time sync
  become: yes
  command: chronyc makestep
  changed_when: false
