- name: Unhold kubeadm package
  become: yes
  dpkg_selections:
    name: kubeadm
    selection: install

- name: Upgrade kubeadm
  become: yes
  apt:
    name: kubeadm={{ kubeadm_version }}
    state: present
    update_cache: yes

- name: Hold kubeadm package again
  become: yes
  dpkg_selections:
    name: kubeadm
    selection: hold

- name: Install pexpect
  become: yes
  apt:
    name: python3-pexpect
    state: present

- name: Run kubeadm upgrade
  expect:
    command: kubeadm upgrade apply {{ upgrade_version }}
    echo: yes
    timeout: 250
    responses:
      upgrade?: "y"
