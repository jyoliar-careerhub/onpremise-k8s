# kube-vip 포트 (baremetal 환경에서만)
- name: Open kube-vip Prometheus metrics port

  become: yes
  ufw:
    rule: allow
    port: "2112"
    proto: tcp
    # from_ip: "{{ internal_network_cidr }}"
  when: infra_provider | default('baremetal') == 'baremetal'

- name: Open iperf3 port

  become: yes
  ufw:
    rule: allow
    port: "5201"
    proto: tcp
    # from_ip: "{{ internal_network_cidr }}"

- name: Enable IP forwarding in ufw
  become: yes
  lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: "^#?net/ipv4/ip_forward"
    line: "net/ipv4/ip_forward=1"

- name: Enable IP forwarding for IPv6
  become: yes
  lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: "^#?net/ipv6/conf/default/forwarding"
    line: "net/ipv6/conf/default/forwarding=1"

- name: Enable ufw
  become: yes
  ufw:
    state: enabled
