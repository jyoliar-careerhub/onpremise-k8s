- name: Drain node
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data
  delegate_to: "{{ groups['k8s-masters'][0] }}"

- name: Unhold kubelet and kubectl packages
  become: true
  dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubelet
    - kubectl

- name: Upgrade kubelet and kubectl
  become: true
  apt:
    name:
      - kubelet={{ kubelet_version }}
      - kubectl={{ kubectl_version }}
    state: present
    update_cache: true

- name: Hold kubelet and kubectl packages again
  become: true
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubectl

- name: Restart kubelet
  systemd:
    state: restarted
    daemon_reload: true
    name: kubelet
    enabled: true

- name: Wait for node to be Ready
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf get node {{ inventory_hostname }} --no-headers
  delegate_to: "{{ groups['k8s-masters'][0] }}"
  register: node_status
  until: "'NotReady' not in node_status.stdout and 'Ready' in node_status.stdout"
  retries: 30
  delay: 10
  changed_when: false

- name: Bring the host back online
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf uncordon {{ inventory_hostname }}
  delegate_to: "{{ groups['k8s-masters'][0] }}"
