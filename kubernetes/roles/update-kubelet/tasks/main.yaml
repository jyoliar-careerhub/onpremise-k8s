- name: Drain node
  shell: kubectl --kubeconfig=/tmp/kubeadm-ha/config drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data
  delegate_to: "{{ groups['k8s-masters'][0] }}"

- name: Unhold kubelet package
  become: yes
  dpkg_selections:
    name: kubelet
    selection: install

- name: Upgrade kubelet
  become: yes
  apt:
    name: kubelet={{ kubelet_version }}
    state: present
    update_cache: yes

- name: Hold kubelet package again
  become: yes
  dpkg_selections:
    name: kubelet
    selection: hold

- name: Restart kubelet
  systemd:
    state: restarted
    daemon_reload: yes
    name: kubelet
    enabled: yes

- name: Bring the host back online
  shell: kubectl --kubeconfig=/tmp/kubeadm-ha/config uncordon {{ inventory_hostname }}
  delegate_to: "{{ groups['k8s-masters'][0] }}"
