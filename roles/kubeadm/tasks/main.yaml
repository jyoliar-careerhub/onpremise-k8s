- name: Remove swapfile from /etc/fstab
  mount:
    name: swap
    fstype: swap
    state: absent

- name: Turn swap off
  shell: swapoff -a

# SELinux not used on Ubuntu (AppArmor is default, no action needed)

- name: Install kubeadm packages
  become: yes
  apt:
    name:
      - kubelet={{ kubelet_version }}
      - kubeadm={{ kubeadm_version }}
      - kubectl={{ kubectl_version }}
    state: present
    update_cache: yes

- name: Hold kubernetes packages (prevent auto-upgrade)
  become: yes
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Load br_netfilter module
  modprobe:
    name: br_netfilter
    state: present

- name: Ensure br_netfilter loads on boot
  lineinfile:
    path: /etc/modules-load.d/k8s.conf
    line: 'br_netfilter'
    state: present
    create: yes

- name: Load overlay module
  modprobe:
    name: overlay
    state: present

- name: Ensure overlay loads on boot
  lineinfile:
    path: /etc/modules-load.d/k8s.conf
    line: 'overlay'
    state: present

- name: Add netbridge config ip6
  lineinfile:
    path: /etc/sysctl.d/k8s.conf
    line: 'net.bridge.bridge-nf-call-ip6tables = 1'
    state: present
    create: yes

- name: Add netbridge config ip4
  lineinfile:
    path: /etc/sysctl.d/k8s.conf
    line: 'net.bridge.bridge-nf-call-iptables = 1'
    state: present
    create: yes

- name: Enable IP forwarding
  lineinfile:
    path: /etc/sysctl.d/k8s.conf
    line: 'net.ipv4.ip_forward = 1'
    state: present

- name: Update sysctl
  command: sysctl --system

- set_fact:
   eviction_hard: "{{ kubelet_masters_eviction_hard }}"
  when: inventory_hostname in groups["k8s-masters"]

- set_fact:
   eviction_hard: "{{ kubelet_workers_eviction_hard }}"
  when: inventory_hostname in groups["k8s-workers"]

- name: Create kubelet service directory
  file:
    path: /etc/systemd/system/kubelet.service.d
    state: directory
    mode: '0755'

- name: Configure kubelet extra args for CRI-O
  lineinfile:
    path: /etc/systemd/system/kubelet.service.d/20-crio.conf
    create: yes
    state: present
    line: |
       [Service]
       Environment="KUBELET_EXTRA_ARGS=--container-runtime-endpoint=unix:///var/run/crio/crio.sock --eviction-hard={{ eviction_hard }}"

- name: Pull container images with crictl
  shell: crictl pull "{{ item }}"
  with_items:
    - "{{ kubeproxy_container_image }}"
    - "{{ kubepause_container_image }}"
    - "{{ flannel_container_image }}"
    - "{{ coredns_container_image }}"
  when: setup=="private"
  ignore_errors: yes

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
