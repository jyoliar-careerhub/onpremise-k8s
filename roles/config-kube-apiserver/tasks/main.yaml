- name: Backup kube-apiserver.yaml
  shell: cp /etc/kubernetes/manifests/kube-apiserver.yaml /tmp/kube-apiserver.yaml.$(date +%Y%m%d%H%M%S)

# PodPreset (settings.k8s.io/v1alpha1)은 Kubernetes 1.20에서 제거됨
# Kubernetes 1.34에서는 kube-apiserver 추가 설정 불필요
- debug:
    msg: "kube-apiserver configuration is standard for Kubernetes 1.34+"