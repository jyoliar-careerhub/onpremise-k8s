apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v{{ kubernetes_version }}.0
# infra_provider에 따른 controlPlaneEndpoint 설정:
# - baremetal: kube-vip VIP 사용
# - aws: AWS NLB DNS 사용
{% if infra_provider | default('baremetal') == 'aws' %}
controlPlaneEndpoint: "{{ nlb_dns_name }}:6443"
{% else %}
controlPlaneEndpoint: "{{ virtual_ip }}:6443"
{% endif %}
networking:
  podSubnet: {{ pod_network_cidr }}
apiServer:
  certSANs:
{% if infra_provider | default('baremetal') == 'aws' and nlb_dns_name is defined %}
  - {{ nlb_dns_name }}
{% elif virtual_ip is defined %}
  - {{ virtual_ip }}
{% endif %}
{% for master in groups["dc1-k8s-masters"] %}
  - {{ hostvars[master]['ansible_host'] }}
{% endfor %}
  - localhost
  - 127.0.0.1
{% if setup == "private" and container_registry is defined %}
imageRepository: {{ container_registry }}
{% endif %}
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
serverTLSBootstrap: true
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock