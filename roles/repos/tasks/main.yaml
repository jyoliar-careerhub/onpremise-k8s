# vault 참조 제거됨 (whis-platform 프로젝트 의존성)

- name: Install required packages for apt repository
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
    state: present
    update_cache: yes

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# CRI-O repository setup (OpenSUSE)
- name: Add CRI-O GPG key
  shell: |
    curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version }}/deb/Release.key | \
    gpg --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/cri-o-apt-keyring.gpg
  when: setup=="public"

- name: Add CRI-O repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version }}/deb/ /"
    state: present
    filename: cri-o
  when: setup=="public"

# Kubernetes repository setup (pkgs.k8s.io)
- name: Add Kubernetes GPG key
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key | \
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: setup=="public"

- name: Add Kubernetes repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    state: present
    filename: kubernetes
  when: setup=="public"

# Private repository setup (Artifactory)
- name: Add Artifactory GPG key
  shell: |
    curl -fsSL https://{{ container_registry_username | trim | urlencode() }}:{{ container_registry_password | trim }}@na.artifactory.swg-devops.com/artifactory/api/gpg/key/public | \
    gpg --dearmor -o /etc/apt/keyrings/artifactory-keyring.gpg
  args:
    creates: /etc/apt/keyrings/artifactory-keyring.gpg
  when: setup=="private"
  ignore_errors: yes

- name: Add Artifactory apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/artifactory-keyring.gpg trusted=yes] https://{{ container_registry_username | trim | urlencode() }}:{{ container_registry_password | trim }}@na.artifactory.swg-devops.com/artifactory/wh-imaging-prereqs-deb-local/ noble main"
    state: present
    filename: artifactory
  when: setup=="private"

- name: Update apt cache
  apt:
    update_cache: yes
