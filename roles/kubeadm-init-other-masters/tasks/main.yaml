- name: Copy join command from controller
  copy:
    src: /tmp/kubeadm-ha/join-command
    dest: /tmp/kubeadm-ha/join-command
    mode: '0755'

- name: Copy certificate key from controller
  copy:
    src: /tmp/kubeadm-ha/certificate-key
    dest: /tmp/kubeadm-ha/certificate-key
    mode: '0600'

- name: Read join command
  slurp:
    src: /tmp/kubeadm-ha/join-command
  register: join_command_file

- name: Read certificate key
  slurp:
    src: /tmp/kubeadm-ha/certificate-key
  register: cert_key_file

- name: Join as control plane node
  shell: |
    {{ join_command_file.content | b64decode | trim }} \
      --control-plane \
      --certificate-key {{ cert_key_file.content | b64decode | trim }} \
      --cri-socket unix:///var/run/crio/crio.sock
  register: join_result

- name: Store join output
  copy:
    content: "{{ join_result.stdout }}"
    dest: /etc/kubernetes/kubeadm-join.stdout

- name: Create .kube folder
  file:
    path: "~{{ ansible_ssh_user }}/.kube"
    state: directory
    owner: "{{ ansible_ssh_user }}"
    group: "{{ ansible_ssh_user }}"

- name: Copy admin.conf to .kube folder
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "~{{ ansible_ssh_user }}/.kube/config"
    owner: "{{ ansible_ssh_user }}"
    group: "{{ ansible_ssh_user }}"
    remote_src: yes
