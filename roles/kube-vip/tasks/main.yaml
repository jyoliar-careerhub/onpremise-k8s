---
# kube-vip Control Plane HA 및 Service LoadBalancer 설정
# 참고: https://kube-vip.io/docs/

- name: kube-vip static pod manifest 생성 (마스터 노드)
  template:
    src: kube-vip-static-pod.yaml.j2
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    owner: root
    group: root
    mode: '0644'
  when: "'k8s-masters' in group_names"
  tags:
    - kube-vip
    - kube-vip-static-pod

- name: super-admin.conf 존재 여부 확인
  stat:
    path: /etc/kubernetes/super-admin.conf
  register: super_admin_conf
  when: inventory_hostname == groups['k8s-masters'][0]

- name: kube-vip RBAC 생성 (첫 번째 마스터에서만)
  shell: |
    kubectl --kubeconfig /etc/kubernetes/super-admin.conf apply -f https://kube-vip.io/manifests/rbac.yaml
  when:
    - inventory_hostname == groups['k8s-masters'][0]
    - super_admin_conf.stat.exists | default(false)
  tags:
    - kube-vip
    - kube-vip-rbac

- name: kube-vip Cloud Controller ConfigMap 생성
  template:
    src: kube-vip-cloud-controller-cm.yaml.j2
    dest: /tmp/kube-vip-cloud-controller-cm.yaml
    owner: root
    group: root
    mode: '0644'
  when:
    - inventory_hostname == groups['k8s-masters'][0]
    - kube_vip_lb_enabled | default(true) | bool
  tags:
    - kube-vip
    - kube-vip-lb

- name: kube-vip Cloud Controller ConfigMap 적용
  shell: |
    kubectl --kubeconfig /etc/kubernetes/super-admin.conf apply -f /tmp/kube-vip-cloud-controller-cm.yaml
  when:
    - inventory_hostname == groups['k8s-masters'][0]
    - super_admin_conf.stat.exists | default(false)
    - kube_vip_lb_enabled | default(true) | bool
  tags:
    - kube-vip
    - kube-vip-lb

- name: kube-vip Cloud Controller 배포
  shell: |
    kubectl --kubeconfig /etc/kubernetes/super-admin.conf apply -f https://raw.githubusercontent.com/kube-vip/kube-vip-cloud-provider/main/manifest/kube-vip-cloud-controller.yaml
  when:
    - inventory_hostname == groups['k8s-masters'][0]
    - super_admin_conf.stat.exists | default(false)
    - kube_vip_lb_enabled | default(true) | bool
  tags:
    - kube-vip
    - kube-vip-lb
