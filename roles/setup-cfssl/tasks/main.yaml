- name: Set cfssl architecture
  set_fact:
    cfssl_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Download cfssl
  get_url:
    url: "https://github.com/cloudflare/cfssl/releases/download/v1.6.5/cfssl_1.6.5_linux_{{ cfssl_arch }}"
    dest: /usr/local/bin/cfssl
    mode: '0755'
    timeout: 120

- name: Download cfssljson
  get_url:
    url: "https://github.com/cloudflare/cfssl/releases/download/v1.6.5/cfssljson_1.6.5_linux_{{ cfssl_arch }}"
    dest: /usr/local/bin/cfssljson
    mode: '0755'
    timeout: 120