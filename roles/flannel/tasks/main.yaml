- name: Copy flannel yaml
  template:
    src: flannel.yaml.j2
    dest: /tmp/kubeadm-ha/flannel.yaml

- name: Create credentials to access private repository
  shell: |
    kubectl -n kube-flannel --kubeconfig=/tmp/kubeadm-ha/config get secret regcred 2>/dev/null || \
    kubectl -n kube-flannel --kubeconfig=/tmp/kubeadm-ha/config create secret docker-registry regcred \
      --docker-server={{ container_registry }} \
      --docker-username={{ container_registry_username }} \
      --docker-password={{ container_registry_password }} \
      --docker-email={{ container_registry_email }}
  when: setup == "private"

- name: Deploy flannel pod network
  shell: kubectl apply --kubeconfig=/tmp/kubeadm-ha/config -f /tmp/kubeadm-ha/flannel.yaml
