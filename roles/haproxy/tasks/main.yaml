- name: Install HAProxy
  apt:
    name: haproxy
    state: present
    update_cache: yes

- name: Generate and copy HAproxy config
  template:
    src: haproxyConfig.j2
    dest: /etc/haproxy/haproxy.cfg
  register: hapConfig

- name: Enable and start HAProxy service
  systemd:
    name: haproxy
    state: started
    enabled: yes
    daemon_reload: yes

- name: Restart HAProxy if config changed
  systemd:
    name: haproxy
    state: restarted
  when: hapConfig.changed